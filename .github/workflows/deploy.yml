```yaml
name: Build and deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  HUGO_VERSION: 0.167.0

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout source repository
      - name: Checkout Hugo source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      # Checkout profile repository
      - name: Checkout profile repository
        uses: actions/checkout@v4
        with:
          repository: amritxyz/amritxyz
          token: ${{ secrets.README_TOKEN }}
          path: profile

      # Generate README
      - name: Generate README
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          template_path = Path("profile/README.template.md")
          output_path = Path("profile/README.md")

          template = template_path.read_text()

          posts = []

          for path in Path("content/blog").rglob("*.md"):
              if path.name == "_index.md":
                  continue

              text = path.read_text()

              # Support both YAML and TOML front matter:
              #
              # title: "Something"
              # title = "Something"
              title_match = re.search(
                  r'^(?:title)\s*[:=]\s*["\']?(.*?)["\']?\s*$',
                  text,
                  re.MULTILINE
              )

              title = (
                  title_match.group(1).strip()
                  if title_match
                  else path.stem.replace("_", " ").replace("-", " ").title()
              )

              date_match = re.search(
                  r'^(?:date)\s*[:=]\s*["\']?(.*?)["\']?\s*$',
                  text,
                  re.MULTILINE
              )

              date = (
                  date_match.group(1).strip()
                  if date_match
                  else ""
              )

              # content/blog/my-post.md
              #
              # becomes:
              # https://amritxyz.github.io/blog/my-post/
              relative = path.relative_to("content")
              slug = str(relative.with_suffix("")).replace("\\", "/")

              url = f"https://amritxyz.github.io/{slug}/"

              posts.append({
                  "title": title,
                  "date": date,
                  "url": url,
              })

          # Newest posts first
          posts.sort(
              key=lambda post: post["date"],
              reverse=True
          )

          blog_list = "\n".join(
              f"- [{post['title']}]({post['url']})"
              for post in posts
          )

          if not blog_list:
              blog_list = "_No blog posts yet._"

          # Replace {{blog_list}} in README.template.md
          readme = template.replace(
              "{{blog_list}}",
              blog_list
          )

          output_path.write_text(readme)

          print(f"Generated README with {len(posts)} blog post(s).")
          PY

      # Push README to amritxyz repository
      - name: Commit README changes
        working-directory: profile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "README.md is already up to date."
            exit 0
          fi

          git commit -m "chore: update README blog list"
          git push

      # Build site
      - name: Setup GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build Hugo
        run: |
          rm -rf public
          hugo --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      # Deploy public directory
      - name: Upload Hugo public directory
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
```
